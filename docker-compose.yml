version: "3.8"
services:
  komga_dev:
    build: .
    ports:
      - "25601:25601"
    volumes:
      - ./test_library:/data
    env_file:
      - .env
    environment:
      - KOMGA_LIBRARIES_PATHS=/data
      - SPRING_PROFILES_ACTIVE=dev,noclaim
      - KINDLE_SSH_PASSWORD=
      - KINDLE_SSH_PORT=2222
      - SERVER_PORT=25601
    restart: unless-stopped 
