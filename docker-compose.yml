services:
  komga-kindle-dev:
    build:
      context: .
      dockerfile: Dockerfile
#    image: komga-kindle:latest
    image: komga-kindle:dev
    ports:
      - "25601:25600"
      # Progress app runs internally on port 5001, no host mapping to avoid conflicts
    volumes:
      # Config Folder
       - type: bind
         source: /mnt/dockerHDD/opt/komga
         target: /config
      # Library Folder      
       - type: bind
         source: /mnt/mainHDD
         target: /data

    env_file:
      - .env
    environment:
#      - KOMGA_LIBRARIES_PATHS=/data
      - SPRING_PROFILES_ACTIVE=prod
      # Kindle configuration - adjust as needed
      - KINDLE_IP=${KINDLE_IP}
      - KINDLE_USER=${KINDLE_USER}
      - KINDLE_REMOTE_PATH=${KINDLE_REMOTE_PATH}
      - KINDLE_SSH_PASSWORD=${KINDLE_SSH_PASSWORD}
      - KINDLE_SSH_PORT=${KINDLE_SSH_PORT}
    restart: unless-stopped