version: '3.8'

services:
  komga-dev:
    image: komga:dev  # Use the built image instead of building from backend-build stage
    ports:
      - "25601:25601"
    volumes:
      # Mount test library and custom scripts
      - ./test_library:/app/komga_custom/test_library
      - ./komga_custom:/app/komga_custom
    environment:
      - KOMGA_LIBRARIES_PATHS=/app/komga_custom/test_library
      - SPRING_PROFILES_ACTIVE=dev,noclaim

  # Alternative: Use the full build for testing
  komga-test:
    build: .
    ports:
      - "25602:25601"
    volumes:
      - ./komga_custom:/app/komga_custom
    environment:
      - SPRING_PROFILES_ACTIVE=dev 