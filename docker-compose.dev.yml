version: '3.8'

services:
  komga-dev:
    image: komga-kindle:dev  # Use the built image instead of building from backend-build stage
    ports:
      - "25600:25600"
    volumes:
      # Mount test library and custom scripts
      - ./test_library:/app/komga_custom/test_library
      - ./komga_custom:/app/komga_custom
    env_file:
      - .env
    environment:
      - KOMGA_LIBRARIES_PATHS=/app/komga_custom/test_library
      - SPRING_PROFILES_ACTIVE=dev,noclaim
      - KINDLE_SSH_PASSWORD=
      - KINDLE_SSH_PORT=2222

  # Alternative: Use the full build for testing
  komga-test:
    build: .
    ports:
      - "25602:25600"
    volumes:
      - ./komga_custom:/app/komga_custom
    environment:
      - SPRING_PROFILES_ACTIVE=dev 